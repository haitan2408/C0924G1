    let num;
    do {
        num = +prompt("Mời bạn nhập số để kiểm tra. Yêu cầu phải lớn hơn hoăc bằng 2 và phải là số nguyên");
    }while (num < 2 || num % 1 !== 0)

    let isPrime = true;
    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) {
            isPrime = false;
            break;
        }
    }
    if (!isPrime) {
        alert("Không phải là số nguyên tố")
    } else {
        alert("Là số nguyên tố.")
    }
</script>
