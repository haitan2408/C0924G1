<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="display"></div>
<script>
    let board = [];
    let isOnePlayer = true;
    for (let i = 0; i < 20; i++) {
        board[i] = [];
        for (let j = 0; j < 20; j++) {
            board[i][j] = ""
        }
    }
    displayBoard()

    function displayBoard() {
        let result = "<table border='1px'>"
        for (let i = 0; i < board.length; i++) {
            result += "<tr>"
            for (let j = 0; j < board[i].length; j++) {
                result += `<td width="50px" height="50px" style="text-align: center" onclick="play(${i}, ${j})">${board[i][j]}</td>`
            }
            result += "</tr>"
        }
        result += "</table>"
        document.getElementById("display").innerHTML = result
    }

    function play(i, j) {
        if (board[i][j] === "") {
            if (isOnePlayer) {
                board[i][j] = "X";
                isOnePlayer = false;
            } else {
                board[i][j] = "O";
                isOnePlayer = true;
            }

            displayBoard()
        }
    }
</script>
</body>
</html>
