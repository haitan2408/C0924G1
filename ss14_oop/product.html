<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div id="result" class="row"></div>
</div>
<script>
    class Product {
        code;
        name;
        price;
        description;
        expirationDate;
        image;
        manufacturer;

        constructor(code, name, price, description, expirationDate, image, manufacturer) {
            this.code = code;
            this.name = name;
            this.price = price;
            this.description = description;
            this.expirationDate = expirationDate;
            this.image = image;
            this.manufacturer = manufacturer;
        }

        sale(percent) {
            this.price = this.price - this.price*(percent);
        }
    }

    let ss23 = new Product(1, "SS23 ultra", 20000000, "Đắt", undefined, "https://cdn2.cellphones.com.vn/insecure/rs:fill:0:358/q:90/plain/https://cellphones.com.vn/media/catalog/product/s/2/s23-ultra-xanh.png", "SamSung");
    let iphone = new Product(2, "iphone16", 30000000, "Đắt mà không có gì thay đổi", undefined, "https://cdn1.viettelstore.vn/images/Product/ProductImage/medium/iPhone-16-Pro-Series-Desert11345601058.jpg", "Apple");
    let products = [ss23, iphone]
    function displayAllProduct(products) {
        let result = "";
        for (let i = 0; i < products.length; i++) {
            result += ` <div class="col-3">
<div class="card" style="width: 18rem;">
    <img src="${products[i].image}" class="card-img-top" alt="...">
    <div class="card-body">
        <h5 class="card-title">${products[i].name}</h5>
        <p class="card-text">${products[i].description}</p>
        <a href="#" class="btn btn-primary">Mua hàng</a>
    </div>
</div></div>`
        }
        document.getElementById("result").innerHTML = result
    }

    displayAllProduct(products)


</script>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
